name: Game data bump
# The game data comes from the private tawan475/genshin-game-data, pinned to
# a release tag in apps/tracker/package.json. When it releases (its
# release.yml sends `repository_dispatch` `game-data-release` with the tag),
# or at the 3-hourly check for a newer tag, this bumps the dependency on a
# branch, runs the tests, type check and build, opens a pull request and
# merges it when they pass; then deploy.yml deploys the merge. A failing
# check leaves the pull request open (label `needs-human`) for a human.
#
# The merge is made with the workflow's token, which starts no push workflow,
# so this calls deploy.yml itself. Beside it, it starts the self-host smoke
# test (self-host.yml) as a run of its own, only while the repository variable
# SELF_HOST_SMOKE is 1 and the public game data, tawan475/teyvat.me-game-data,
# has the tag just pinned (a self-host's image builds from it); otherwise that
# is skipped quietly. The smoke test's outcome shows on its own run and in the
# `self-host` issue, never on this run.
on:
  repository_dispatch:
    types: [game-data-release]
  schedule:
    - cron: '29 */3 * * *' # every 3 hours: the data repo has no token to notify this one
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (default: the newest)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: game-data-bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      merged: ${{ steps.merge.outputs.merged }}
      sha: ${{ steps.merge.outputs.sha }}
      smoke: ${{ steps.smoke.outputs.run }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          game-data-deploy-key: ${{ secrets.GAME_DATA_DEPLOY_KEY }}
          game-data-token: ${{ secrets.GAME_DATA_TOKEN }}
          install: 'false'

      - name: Which release
        id: tag
        env:
          PAYLOAD_TAG: ${{ github.event.client_payload.tag }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          current=$(node -p "(require('./apps/tracker/package.json').dependencies['@gdt/game-data'] ?? '').split('#')[1] ?? ''")
          tag="${PAYLOAD_TAG:-$INPUT_TAG}"
          if [ -z "$tag" ]; then
            tag=$(git ls-remote --tags --refs https://github.com/tawan475/genshin-game-data.git 'v*' \
              | sed 's#.*refs/tags/##' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          fi
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::No release tag to bump to (got '$tag')."
            exit 1
          fi
          newest=$(printf '%s\n%s\n' "$current" "$tag" | sort -V | tail -n 1)
          echo "current $current, release $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "branch=game-data/$tag" >> "$GITHUB_OUTPUT"
          if [ "$tag" = "$current" ] || [ "$newest" != "$tag" ]; then
            echo "Already on $current."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$(gh pr list --head "game-data/$tag" --state open --json number --jq '.[].number')" ]; then
            echo "A pull request for $tag is open already: a human has it."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump
        if: steps.tag.outputs.skip == 'false'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: pnpm --filter @gdt/tracker add "@gdt/game-data@github:tawan475/genshin-game-data#${TAG}"

      # `add` with a filter installs only the tracker's own dependencies; the
      # checks need the whole workspace (packages/shared's zod and the rest).
      - name: Install the workspace
        if: steps.tag.outputs.skip == 'false'
        run: pnpm install --frozen-lockfile

      - name: Tests
        id: test
        if: steps.tag.outputs.skip == 'false'
        continue-on-error: true
        run: pnpm test

      - name: Type check
        id: typecheck
        if: steps.tag.outputs.skip == 'false'
        continue-on-error: true
        run: pnpm type-check

      - name: Build
        id: build
        if: steps.tag.outputs.skip == 'false'
        continue-on-error: true
        run: pnpm --filter @gdt/tracker build-only

      - name: Pull request
        id: merge
        if: steps.tag.outputs.skip == 'false'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          BRANCH: ${{ steps.tag.outputs.branch }}
          PASSED: ${{ steps.test.outcome == 'success' && steps.typecheck.outcome == 'success' && steps.build.outcome == 'success' }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add apps/tracker/package.json pnpm-lock.yaml
          git commit -m "Game data $TAG" -m "Bumped by the Game data bump workflow."
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "HEAD:refs/heads/${BRANCH}"
          {
            echo "Game data release [${TAG}](https://github.com/tawan475/genshin-game-data/releases/tag/${TAG})."
            echo
            if [ "$PASSED" = "true" ]; then
              echo "Tests, type check and build pass: merged and deployed by the workflow."
            else
              echo "**Needs a human**: tests ${{ steps.test.outcome }}, type check ${{ steps.typecheck.outcome }}, build ${{ steps.build.outcome }}. Fix it on this branch and merge (deploy.yml deploys the merge)."
            fi
            echo
            echo "Run: $RUN"
          } > body.md
          url=$(gh pr create --base main --head "$BRANCH" --title "Game data $TAG" --body-file body.md)
          echo "$url"
          if [ "$PASSED" = "true" ]; then
            gh pr merge "$url" --merge --delete-branch
            echo "merged=true" >> "$GITHUB_OUTPUT"
            echo "sha=$(gh pr view "$url" --json mergeCommit --jq .mergeCommit.oid)" >> "$GITHUB_OUTPUT"
          else
            gh label create needs-human --color d93f0b --description "Waits for a human" 2> /dev/null || true
            gh pr edit "$url" --add-label needs-human
            echo "merged=false" >> "$GITHUB_OUTPUT"
          fi

      # Whether the self-host job below starts the smoke test for this bump:
      # the public game data must have the tag just pinned (`git ls-remote`,
      # no token; the rule is self-host/public-game-data.mjs `smokeGate`). The
      # script always exits 0 and the step may fail: neither fails the bump.
      - name: Self-host smoke test wanted
        id: smoke
        if: steps.merge.outputs.merged == 'true' && vars.SELF_HOST_SMOKE == '1'
        continue-on-error: true
        env:
          SELF_HOST_SMOKE: ${{ vars.SELF_HOST_SMOKE }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: node self-host/smoke-gate.mjs "$TAG"

  deploy:
    needs: bump
    if: needs.bump.outputs.merged == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.bump.outputs.sha }}
    secrets: inherit

  # A self-host's image builds from this bump's lockfile and the public game
  # data at the same tag. Beside the deploy, never before it, and as a run of
  # its own (`gh workflow run`: a workflow_dispatch the workflow's token may
  # send), so a failing smoke test opens the `self-host` issue from its own
  # run and this run stays green. Skipped unless the repository variable
  # SELF_HOST_SMOKE is 1 and the public game data has the tag (the bump job's
  # last step). The token here can start workflows and nothing else.
  self-host:
    needs: bump
    if: needs.bump.outputs.merged == 'true' && vars.SELF_HOST_SMOKE == '1' && needs.bump.outputs.smoke == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Start the smoke test on the merge commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.bump.outputs.sha }}
        run: |
          if gh workflow run self-host.yml --repo "$GITHUB_REPOSITORY" --ref main -f "ref=$SHA"; then
            echo "Started: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/workflows/self-host.yml"
          else
            echo "::warning::Could not start the self-host smoke test for ${SHA}. Start it by hand: Actions > Self-host smoke test > Run workflow."
          fi
