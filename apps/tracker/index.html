<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#f8fafc" />
    <script>
      // The site moved to teyvat.me: the old address (still the API for
      // installed irminsul copies) sends its pages there, path and all. A
      // Redirect Rule on 475.dev does this as a 301 (README); this covers
      // pages a service worker or cache still holds.
      if (location.hostname === 'genshin-tracker.475.dev') {
        location.replace('https://teyvat.me' + location.pathname + location.search + location.hash)
      }
      // Theme before first paint: the user's choice, else the OS preference.
      // The public pages (/, /login, /register) are always dark (lib/theme.ts).
      ;(function () {
        var root = document.documentElement
        var pub = /^\/(login|register)?\/?$/.test(location.pathname)
        var dark = pub
        try {
          var t = localStorage.getItem('gdt:theme')
          dark =
            dark ||
            t === 'dark' ||
            (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        } catch (_) {}
        if (pub) root.setAttribute('data-public', '')
        if (dark) {
          root.dataset.theme = 'dark'
          document.querySelector('meta[name="theme-color"]').content = pub ? '#0f131f' : '#0f172a'
        }
      })()
      // Language before first paint (its font stack follows <html lang>): this
      // device's pick, else the browser's. Same rules as i18n/locale.ts.
      ;(function () {
        try {
          var lang = localStorage.getItem('gdt:lang')
          var ours = ['en', 'zh-CN', 'zh-TW', 'ja', 'ko', 'es', 'fr', 'ru', 'th', 'vi', 'de', 'id', 'pt', 'it', 'tr']
          if (ours.indexOf(lang) < 0) {
            lang = 'en'
            var tags =
              navigator.languages && navigator.languages.length
                ? navigator.languages
                : navigator.language
                  ? [navigator.language]
                  : []
            for (var i = 0; i < tags.length; i++) {
              var parts = String(tags[i]).toLowerCase().split(/[-_]/)
              var base = parts[0]
              if (base === 'zh' || base === 'yue') {
                var p = '-' + parts.join('-') + '-'
                lang = /-hant-/.test(p)
                  ? 'zh-TW'
                  : /-hans-/.test(p)
                    ? 'zh-CN'
                    : /-(tw|hk|mo)-/.test(p) || base === 'yue'
                      ? 'zh-TW'
                      : 'zh-CN'
                break
              }
              if (base === 'in') base = 'id'
              if (ours.indexOf(base) >= 0) {
                lang = base
                break
              }
            }
          }
          document.documentElement.lang = lang
          // The language's web font (a copy of lib/language-fonts.ts' table).
          var fonts = {
            th: 'Noto+Sans+Thai:wght@400;500;600;700',
            ru: 'Manrope:wght@400;500;600;700;800',
          }
          if (fonts[lang]) {
            var link = document.createElement('link')
            link.rel = 'stylesheet'
            link.href = 'https://fonts.googleapis.com/css2?family=' + fonts[lang] + '&display=swap'
            link.setAttribute('data-language-font', lang)
            document.head.appendChild(link)
          }
        } catch (_) {}
      })()
    </script>
    <script>
      // A prerendered page (build/prerender.ts) carries its English text in
      // #app until the app mounts. In another language, or where this file is
      // the fallback for another route (index.html is the landing page's), that
      // text is hidden so it never shows first.
      ;(function () {
        var root = document.documentElement
        var page = root.getAttribute('data-prerendered')
        var here = location.pathname.replace(/\/+$/, '') || '/'
        if (page !== null && (root.lang !== 'en' || here !== page)) {
          root.setAttribute('data-prerender-hide', '')
        }
      })()
    </script>
    <style>
      html[data-prerender-hide] #app[data-prerendered] {
        display: none;
      }
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- The landing page's; every route sets its own (src/router/document-meta.ts). -->
    <title>Teyvat.me · Genshin Impact account tracker</title>
    <meta
      name="description"
      content="Teyvat.me is a free Genshin Impact account tracker: characters and builds, artifacts, materials and a planner, achievements, wish history and endgame records over time, kept up to date by the free Teyvat.me Capture app."
    />
    <meta property="og:site_name" content="Teyvat.me" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Teyvat.me · Genshin Impact account tracker" />
    <meta
      property="og:description"
      content="Teyvat.me is a free Genshin Impact account tracker: characters and builds, artifacts, materials and a planner, achievements, wish history and endgame records over time, kept up to date by the free Teyvat.me Capture app."
    />

    -->

            "inLanguage": ["en", "zh-CN", "zh-TW", "ja", "ko", "es", "fr", "ru", "th", "vi", "de", "id", "pt", "it", "tr"]
          },

            "name": "Teyvat.me",
            "url": "https://teyvat.me/",
            "applicationCategory": "UtilitiesApplication",
            "operatingSystem": "Any (web browser)",
            "isAccessibleForFree": true,
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },

            "installUrl": "https://github.com/tawan475/teyvat.me-capture/releases/latest",
            "sameAs": "https://github.com/tawan475/teyvat.me-capture",
            "license": "https://opensource.org/licenses/MIT",
            "description": "The companion app of the Teyvat.me website: a free program for Windows and Android that reads a Genshin Impact account from the game's network traffic while you play, saves it as Leyline (GOOD) JSON and, optionally, keeps a Teyvat.me tracker up to date. It never modifies the game."

    </script>
