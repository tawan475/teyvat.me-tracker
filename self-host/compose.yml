# A self-hosted tracker (README.md in this folder). From self-host/:
#
#   docker compose up -d --build
#
# Settings live in self-host/.env (the template is in the README). Compose reads
# SITE_URL from it for the build; the container reads the whole file, mounted
# read-only, never as its environment.
services:
  tracker:
    build:
      context: ..
      dockerfile: self-host/Dockerfile
      args:
        SITE_URL: ${SITE_URL:?Set SITE_URL in self-host/.env (README.md)}
    init: true
    ports:
      - "127.0.0.1:${PORT:-8787}:8787"
    volumes:
      - tracker-data:/data
      - ./.env:/run/tracker.env:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8787/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3
    restart: unless-stopped

volumes:
  tracker-data:
